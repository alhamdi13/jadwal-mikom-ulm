name: Broadcast Jadwal Kuliah Pagi

on:
  schedule:
    # 21:00 UTC = 05:00 WITA (04:00 WIB)
    # 4 = Kamis malam UTC (Jum'at pagi 05:00 WITA)
    # 5 = Jum'at malam UTC (Sabtu pagi 05:00 WITA)
    # HANYA berjalan di hari Jum'at & Sabtu pagi. Hari Minggu-Kamis tidak akan jalan!
    - cron: '53 20 * * 4,5'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub UI

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Run Morning Broadcast
        env:
          SESSION_DATA_BASE64: ${{ secrets.SESSION_DATA_BASE64 }}
          TZ: 'Asia/Makassar'
        run: node broadcast_runner.js morning
