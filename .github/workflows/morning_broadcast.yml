name: Broadcast Jadwal Kuliah Pagi

on:
  schedule:
    # 22:15 UTC = 06:15 WITA (05:15 WIB)
    # Menit :15 berada di jalur sepi (off-peak) untuk membypass antrean padat server GitHub
    - cron: '15 22 * * *'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub UI

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Run Morning Broadcast
        env:
          SESSION_DATA_BASE64: ${{ secrets.SESSION_DATA_BASE64 }}
          TZ: 'Asia/Makassar'
        run: node broadcast_runner.js
