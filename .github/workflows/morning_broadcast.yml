name: Broadcast Jadwal Kuliah Pagi

on:
  schedule:
    # 22:00 UTC = 06:00 WITA (05:00 WIB) - Kamis malam s.d Jum'at malam untuk kuliah Jum'at & Sabtu
    # 22:30 UTC = 06:30 WITA
    - cron: '30 22 * * 3,4,5'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub UI

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Morning Broadcast
        env:
          SESSION_DATA_BASE64: ${{ secrets.SESSION_DATA_BASE64 }}
          TZ: 'Asia/Jakarta'
        run: node broadcast_runner.js
