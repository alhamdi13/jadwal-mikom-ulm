name: Konfirmasi Jadwal Kuliah Dosen H-1 Sore

on:
  schedule:
    # 08:53 UTC = 16:53 WITA (15:53 WIB)
    # 4 = Kamis sore (konfirmasi jadwal kuliah Jum'at ke Dosen Pengampu)
    # 5 = Jum'at sore (konfirmasi jadwal kuliah Sabtu ke Dosen Pengampu)
    - cron: '53 8 * * 4,5'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub UI

jobs:
  broadcast_h_minus_1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Run H-1 Lecturer Confirmation
        env:
          SESSION_DATA_BASE64: ${{ secrets.SESSION_DATA_BASE64 }}
          TZ: 'Asia/Makassar'
        run: node broadcast_runner.js h_minus_1
