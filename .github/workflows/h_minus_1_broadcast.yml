name: Broadcast Pengingat Kuliah H-1 Sore

on:
  schedule:
    # 09:00 UTC = 17:00 WITA (16:00 WIB)
    # 4 = Kamis sore (pengingat kuliah Jum'at)
    # 5 = Jum'at sore (pengingat kuliah Sabtu)
    - cron: '53 8 * * 4,5'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub UI

jobs:
  broadcast_h_minus_1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Run H-1 Evening Broadcast
        env:
          SESSION_DATA_BASE64: ${{ secrets.SESSION_DATA_BASE64 }}
          TZ: 'Asia/Makassar'
        run: node broadcast_runner.js h_minus_1
